<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Lyric Lane</title>
<style>
:root {
  --bg: #fafaf8;
  --fg: #1a1a1a;
  --muted: #b4b4b0;
  --note: #6b6b6b;
  --rule: #e2e2de;
  --bar-bg: #ffffff;
  --lane-w: 12px;
  --lane-gap: 5px;
  --c0: #2f6fdb;
  --c1: #e28a12;
  --c2: #1f9e6a;
  --c3: #9b4fd6;
  --c4: #d9457a;
  --c5: #12a2a8;
  --c6: #d63a3a;
  --c7: #7a7a7a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141416;
    --fg: #ececea;
    --muted: #55555a;
    --note: #a0a0a0;
    --rule: #2b2b2e;
    --bar-bg: #1c1c1f;
    --c0: #6c9cf0;
    --c1: #f0a93e;
    --c2: #3fc08d;
    --c3: #b98af0;
    --c4: #f07aa3;
    --c5: #3fc6cc;
    --c6: #f06a6a;
    --c7: #9a9a9a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body {
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

/* top bar */
.bar {
  position: sticky; top: 0; z-index: 10;
  background: var(--bar-bg);
  border-bottom: 1px solid var(--rule);
  padding: 8px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
}
.bar h1 { font-size: 18px; margin: 0 8px 0 0; font-weight: 600; }
.tabs { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; max-width: 100%; }
.tabs[hidden] { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--rule);
  color: var(--fg); text-decoration: none; font-size: 14px; white-space: nowrap;
}
.tab .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--tab-color, var(--muted)); }
.tab.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tab.active .dot { outline: 2px solid var(--bg); }

main { max-width: 760px; margin: 0 auto; padding: 16px 16px 80px; }

.msgs { margin-bottom: 16px; }
.msg { padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 14px; }
.msg.error { background: #fde8e8; color: #8a1c1c; }
.msg.warn { background: #fff4d6; color: #7a5200; }
@media (prefers-color-scheme: dark) {
  .msg.error { background: #3a1a1a; color: #f0a0a0; }
  .msg.warn { background: #3a2f12; color: #f0d080; }
}

/* singer names, written vertically and read bottom-up, one per lane column */
.lane-label {
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-size: 9px; font-weight: 600; letter-spacing: 0.3px;
  line-height: var(--lane-w); white-space: nowrap;
  align-self: start; justify-self: center; z-index: 1;
  padding: 4px 0 5px; border-radius: 3px;
}
.lane-label.on-bar { color: var(--bg); }
.lane-label.off-bar { color: var(--lane-color); background: var(--bg); }

/* songs without singers: no lane columns */
.no-lanes .stanza, .no-lanes .page-head { grid-template-columns: 1fr; }

/* stanzas */
.stanza {
  display: grid;
  grid-template-columns: var(--lane-cols) 1fr;
  column-gap: var(--lane-gap);
  row-gap: 0;
  margin-bottom: 22px;
}
.lane { width: var(--lane-w); border-radius: 3px; background: var(--lane-color); }
.text { padding: 2px 0 2px 10px; }
.note {
  padding: 2px 0 2px 10px;
  font-style: italic; font-size: 14px; color: var(--note);
}

/* per-singer emphasis */
.view-singer .text.off { color: var(--muted); }
.view-singer .text.on { font-weight: 600; }
.view-singer .lane.dim { opacity: 0.18; }

/* all-sheets view on screen: stacked sheets with a heading each */
.sheet-head { display: none; margin: 0 0 10px; }
.sheet-head h1 { margin: 0; font-size: 20px; }
.sheet-head .sub { color: var(--note); font-size: 14px; }
.all-sheets .sheet-head { display: block; }
.all-sheets .sheet + .sheet { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--rule); }

.landing h2 {
  font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--note); margin: 8px 0 12px;
}
.landing code { background: var(--rule); padding: 1px 5px; border-radius: 4px; }
.songs { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.song {
  display: block; padding: 12px 16px;
  border: 1px solid var(--rule); border-radius: 10px;
  background: var(--bar-bg); color: var(--fg); text-decoration: none;
}
.song:hover, .song:focus-visible { border-color: var(--fg); outline: none; }
.song .name { font-weight: 600; font-size: 17px; }
.song .who { margin-top: 4px; font-size: 13px; color: var(--note); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.song .who span { display: inline-flex; align-items: center; gap: 6px; }
.song .who .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }

/* phone */
@media (max-width: 600px) {
  #main { --lane-w: 6px; --lane-gap: 3px; font-size: 17px; }
  .bar { padding: 8px 12px; }
  .bar h1 { font-size: 16px; width: 100%; margin: 0; }
  main { padding: 12px 12px 80px; }
  #main .lane-label { display: none; }
  #main .text, #main .note { padding-left: 8px; }
}

/* ---------- print tree ----------
   Built by script: stanzas are measured and packed into fixed-size A4 page boxes,
   so every page gets its own frame, header and "n/total" footer. The tree is laid
   out off-screen at all times (for measuring) and shown only when printing. */
#print-wrap { height: 0; overflow: hidden; }
#print {
  /* always the light palette, and print metrics, regardless of screen theme */
  --bg: #fff; --fg: #000; --muted: #bbb; --note: #555; --rule: #ccc;
  --c0: #2f6fdb; --c1: #e28a12; --c2: #1f9e6a; --c3: #9b4fd6;
  --c4: #d9457a; --c5: #12a2a8; --c6: #d63a3a; --c7: #7a7a7a;
  --lane-w: 10px; --lane-gap: 4px;
  width: 210mm;
  background: var(--bg); color: var(--fg);
  font-size: 11.5pt;
}
/* .page is the whole A4 sheet with the margin built in, so the result does not
   depend on the margin setting in the browser's print dialog (@page margin is 0).
   Height is a hair under 297mm so rounding can never push a sheet onto two pages. */
.page {
  width: 210mm; height: 296.5mm;
  padding: 12mm 12mm 11.5mm;
  break-after: page; break-inside: avoid;
}
.page:last-child { break-after: auto; }
.page-inner {
  height: 100%;
  padding: 3mm 9mm 6mm;
  display: flex; flex-direction: column;
  position: relative;
}
.page-head {
  display: grid; grid-template-columns: var(--lane-cols) 1fr; column-gap: var(--lane-gap);
  margin-bottom: 4px; flex: none;
}
.page-head .lane-label { align-self: end; padding-bottom: 0; }
.page-head .title { align-self: end; padding-left: 10px; }
.page-head .title h1 { margin: 0; font-size: 16pt; }
.page-head .title .sub { color: var(--note); font-size: 10.5pt; }
.page-body { flex: 1; min-height: 0; }
.page-foot {
  position: absolute; right: 6mm; bottom: 2mm;
  font-size: 9pt; color: var(--note);
}
#print .stanza { margin-bottom: 16px; }
#print .stanza .lane-label { display: none; } /* names sit in the page header instead */

@media print {
  @page { size: A4; margin: 0; }
  .bar, #main { display: none; }
  #print-wrap { height: auto; overflow: visible; }
  .lane { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<main id="main"></main>
<div id="print-wrap"><div id="print"></div></div>
<script>
'use strict';

let redraw = () => {};
const PALETTE = ['--c0','--c1','--c2','--c3','--c4','--c5','--c6','--c7'];
const STANZA_GAP = 16; // px, must match #print .stanza margin-bottom

/* ---------- parsing ---------- */

function parseSong(text) {
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const song = { title: '', singers: [], items: [], errors: [], warnings: [] };
  let i = 0;

  for (; i < lines.length; i++) {
    const m = lines[i].match(/^\s*([A-Za-z]+)\s*:\s*(.*)$/);
    if (!m) break;
    const key = m[1].toLowerCase();
    const val = m[2].trim();
    if (key === 'title') song.title = val;
    else if (key === 'singers') song.singers = val.split(',').map(s => s.trim()).filter(Boolean);
    else song.warnings.push({ line: i + 1, msg: `Unknown header "${key}"` });
  }
  if (!song.title) song.errors.push({ line: 1, msg: 'Missing "title:" header' });

  // Without a singers: header everybody sings everything: no lanes, tags not needed.
  let current = song.singers.length ? null : [];
  let pendingBreak = false;

  for (; i < lines.length; i++) {
    const ln = i + 1;
    let s = lines[i].trim();
    if (s === '') { pendingBreak = true; continue; }

    const tm = s.match(/^\[([^\]]*)\]\s*(.*)$/);
    if (tm) {
      const tag = tm[1].trim();
      s = tm[2];
      let names;
      if (tag === '*') {
        names = song.singers.slice();
      } else if (tag === '') {
        names = []; // [] clears the singers, e.g. for an instrumental bridge
      } else {
        names = tag.split('/').map(x => x.trim()).filter(Boolean);
        const bad = names.filter(n => !song.singers.includes(n));
        if (bad.length) song.errors.push({ line: ln, msg: `Unknown singer: ${bad.join(', ')}` });
        names = names.filter(n => song.singers.includes(n));
      }
      current = names;
    }

    if (s.startsWith('//')) {
      song.items.push({ type: 'note', text: s.slice(2).trim(), brk: pendingBreak, line: ln });
      pendingBreak = false;
      continue;
    }
    if (s === '') continue;

    if (current === null) {
      song.errors.push({ line: ln, msg: 'Lyric line before the first singer tag' });
      current = [];
    }
    if (/[Ѐ-ӿ]/.test(s) && /[A-Za-z]/.test(s)) {
      const ch = s.match(/[Ѐ-ӿ]/g).join(' ');
      song.warnings.push({ line: ln, msg: `Cyrillic letter in Latin text (${ch}): "${s}"` });
    }
    song.items.push({ type: 'line', text: s, singers: current.slice(), brk: pendingBreak, line: ln });
    pendingBreak = false;
  }
  return song;
}

/* ---------- helpers ---------- */

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    e.append(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function colorVar(idx) {
  return `var(${PALETTE[idx % PALETTE.length]})`;
}

const ALL_SHEETS = '*';

// Switch view without adding a browser history entry, so "back" leaves the song.
function setView(hash) {
  if (location.hash !== hash) history.replaceState(null, '', hash || location.pathname + location.search);
  redraw();
}

function currentView(song) {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (h === ALL_SHEETS) return ALL_SHEETS;
  return song.singers.includes(h) ? h : null;
}

function sheetsFor(song, view) {
  return view === ALL_SHEETS ? [null, ...song.singers] : [view];
}

// What Ctrl+P prints: a singer's tab prints that sheet only; the overview
// (and the #* view) prints the whole pack, overview plus one sheet per singer.
function printView(view) {
  return view === null ? ALL_SHEETS : view;
}

function groupStanzas(items) {
  const stanzas = [];
  for (const it of items) {
    if (it.brk || !stanzas.length) stanzas.push([]);
    stanzas[stanzas.length - 1].push(it);
  }
  return stanzas;
}

/* ---------- top bar ---------- */

function renderBar(song, selected) {
  const bar = document.getElementById('bar');
  bar.replaceChildren();
  bar.append(el('h1', {}, song.title || 'Lyric Lane'));
  const tabs = el('div', { class: 'tabs' });
  if (!song.singers.length) tabs.hidden = true;
  const tab = (hash, cls, ...children) => {
    const a = el('a', { class: cls, href: hash || '#' }, ...children);
    a.addEventListener('click', (ev) => { ev.preventDefault(); setView(hash); });
    return a;
  };
  tabs.append(tab('', 'tab' + (selected === null ? ' active' : ''), 'All'));
  song.singers.forEach((name, idx) => {
    const a = tab('#' + encodeURIComponent(name), 'tab' + (selected === name ? ' active' : ''),
      el('span', { class: 'dot' }), name);
    a.style.setProperty('--tab-color', colorVar(idx));
    tabs.append(a);
  });
  bar.append(tabs);
}

function renderMessages(song) {
  const box = el('div', { class: 'msgs' });
  for (const e of song.errors) box.append(el('div', { class: 'msg error' }, `Line ${e.line}: ${e.msg}`));
  for (const w of song.warnings) box.append(el('div', { class: 'msg warn' }, `Line ${w.line}: ${w.msg}`));
  return box;
}

/* ---------- stanzas ---------- */

// One grid section per stanza: text cells in the last column, and one seamless
// lane element per contiguous run of lines a singer sings.
function buildStanzas(song, selected) {
  const n = song.singers.length;
  return groupStanzas(song.items).map(stanza => {
    const sec = el('section', { class: 'stanza' });
    stanza.forEach((it, row) => {
      let cell;
      if (it.type === 'note') {
        cell = el('div', { class: 'note' }, it.text);
      } else {
        const on = selected ? it.singers.includes(selected) : true;
        cell = el('div', { class: 'text ' + (on ? 'on' : 'off') }, it.text);
      }
      cell.style.gridColumn = n + 1;
      cell.style.gridRow = row + 1;
      sec.append(cell);
    });
    const runs = song.singers.map(() => []); // per singer: [{ el, start, end }]
    song.singers.forEach((name, idx) => {
      let start = -1;
      const flush = (end) => {
        if (start < 0) return;
        const cls = 'lane' + (selected && selected !== name ? ' dim' : '');
        const lane = el('div', {
          class: cls,
          style: `--lane-color:${colorVar(idx)};grid-column:${idx + 1};grid-row:${start + 1} / ${end + 1}`,
        });
        sec.append(lane);
        runs[idx].push({ el: lane, start, end });
        start = -1;
      };
      stanza.forEach((it, row) => {
        const on = it.type === 'line' && it.singers.includes(name);
        if (on && start < 0) start = row;
        if (!on) flush(row);
      });
      flush(stanza.length);
    });
    return { sec, stanza, runs };
  });
}

// Singer names at the top of the first stanza with lyric lines, one per lane.
// On a bar the name is drawn in the background color; otherwise in the lane color.
function labelLanes(song, sections, selected) {
  const first = sections.find(({ stanza }) => stanza.some(it => it.type === 'line'));
  if (!first) return;
  const { sec, stanza, runs } = first;
  const top = stanza.findIndex(it => it.type === 'line');
  song.singers.forEach((name, idx) => {
    const bar = runs[idx].find(r => r.start === top);
    const onBar = bar && !(selected && selected !== name);
    // The label is a grid item, so the rows (and with them the bar) stretch to
    // fit a long name; a bar that starts here always covers the whole label.
    sec.append(el('div', {
      class: 'lane-label ' + (onBar ? 'on-bar' : 'off-bar'),
      style: `--lane-color:${colorVar(idx)};grid-column:${idx + 1};grid-row:${top + 1} / ${stanza.length + 1}`,
    }, name));
  });
}

/* ---------- screen ---------- */

function renderSheet(song, selected) {
  const sheet = el('div', { class: 'sheet ' + (selected ? 'view-singer' : 'view-all') });
  sheet.append(el('div', { class: 'sheet-head' },
    el('h1', {}, song.title),
    song.singers.length ? el('div', { class: 'sub' }, selected ? selected : 'All') : null));
  const sections = buildStanzas(song, selected);
  for (const { sec } of sections) sheet.append(sec);
  labelLanes(song, sections, selected);
  return sheet;
}

function renderSong(song, view) {
  const main = document.getElementById('main');
  main.replaceChildren();
  main.className = (view === ALL_SHEETS ? 'all-sheets' : '') + (song.singers.length ? '' : ' no-lanes');
  const sub = view === ALL_SHEETS ? 'all sheets' : view;
  document.title = song.title ? (sub ? `${song.title} – ${sub}` : song.title) : 'Lyric Lane';
  main.style.setProperty('--lane-cols', `repeat(${song.singers.length}, var(--lane-w))`);

  main.append(renderMessages(song));
  for (const selected of sheetsFor(song, view)) main.append(renderSheet(song, selected));
}

/* ---------- print ---------- */

function pageHead(song, selected) {
  const head = el('div', { class: 'page-head' });
  song.singers.forEach((name, idx) => {
    head.append(el('div', {
      class: 'lane-label off-bar',
      style: `--lane-color:${colorVar(idx)};grid-column:${idx + 1}`,
    }, name));
  });
  head.append(el('div', { class: 'title', style: `grid-column:${song.singers.length + 1}` },
    el('h1', {}, song.title),
    song.singers.length ? el('div', { class: 'sub' }, selected ? selected : 'All') : null));
  return head;
}

function newPage(song, selected) {
  const page = el('div', { class: 'page ' + (selected ? 'view-singer' : 'view-all') });
  const inner = el('div', { class: 'page-inner' });
  const body = el('div', { class: 'page-body' });
  inner.append(pageHead(song, selected), body);
  page.append(inner);
  return { page, inner, body };
}

// Pack the stanzas of one sheet into as many pages as needed, greedily, never
// splitting a stanza. Heights are measured in the off-screen print tree.
function paginateSheet(song, selected, root) {
  const sections = buildStanzas(song, selected);
  const probe = newPage(song, selected);
  root.append(probe.page);
  const avail = probe.body.clientHeight;
  for (const { sec } of sections) probe.body.append(sec);
  const heights = sections.map(({ sec }) => sec.getBoundingClientRect().height + STANZA_GAP);
  probe.page.remove();

  const groups = [[]];
  let used = 0;
  sections.forEach(({ sec }, i) => {
    if (groups.at(-1).length && used + heights[i] > avail) { groups.push([]); used = 0; }
    groups.at(-1).push(sec);
    used += heights[i];
  });

  return groups.map(secs => {
    const { page, inner, body } = newPage(song, selected);
    for (const sec of secs) body.append(sec);
    return { page, inner };
  });
}

function buildPrint(song, view) {
  const root = document.getElementById('print');
  root.replaceChildren();
  root.className = song.singers.length ? '' : 'no-lanes';
  root.style.setProperty('--lane-cols', `repeat(${song.singers.length}, var(--lane-w))`);
  for (const selected of sheetsFor(song, view)) {
    const pages = paginateSheet(song, selected, root);
    pages.forEach(({ page, inner }, i) => {
      inner.append(el('div', { class: 'page-foot' }, `${i + 1}/${pages.length}`));
      root.append(page);
    });
  }
}

/* ---------- landing ---------- */

async function renderLanding() {
  const bar = document.getElementById('bar');
  bar.replaceChildren(el('h1', {}, 'Lyric Lane'));
  const main = document.getElementById('main');
  main.className = 'landing';
  let list = [];
  try {
    const r = await fetch('songs.txt', { cache: 'no-store' });
    if (r.ok) list = (await r.text()).split('\n').map(s => s.trim()).filter(s => s && !s.startsWith('#'));
  } catch (e) { /* fall through */ }
  if (!list.length) {
    main.replaceChildren(
      el('p', {}, 'No songs found. Add song paths to ', el('code', {}, 'songs.txt'),
        ', and make sure the page is served over http, for example with ',
        el('code', {}, 'python -m http.server'), '.'));
    return;
  }
  const ul = el('ul', { class: 'songs' });
  for (const path of list) {
    const name = el('div', { class: 'name' }, path.replace(/^.*\//, '').replace(/\.txt$/, ''));
    const who = el('div', { class: 'who' });
    const a = el('a', { class: 'song', href: `?song=${encodeURIComponent(path)}` }, name, who);
    ul.append(el('li', {}, a));
    fetch(path, { cache: 'no-store' }).then(r => r.ok ? r.text() : null).then(t => {
      if (!t) return;
      const song = parseSong(t);
      if (song.title) name.textContent = song.title;
      song.singers.forEach((singer, idx) => {
        who.append(el('span', { style: `--dot:${colorVar(idx)}` }, el('i', { class: 'dot' }), singer));
      });
      if (!song.singers.length) who.append(el('span', {}, 'Everyone sings'));
    }).catch(() => {});
  }
  main.replaceChildren(el('h2', {}, 'Songs'), ul);
}

/* ---------- main ---------- */

async function main() {
  const path = new URLSearchParams(location.search).get('song');
  if (!path) { renderLanding(); return; }

  let text;
  try {
    const r = await fetch(path, { cache: 'no-store' });
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    text = await r.text();
  } catch (e) {
    document.getElementById('main').replaceChildren(
      el('div', { class: 'msg error' }, `Could not load "${path}": ${e.message}`));
    return;
  }
  const song = parseSong(text);
  redraw = () => {
    const view = currentView(song);
    renderBar(song, view);
    renderSong(song, view);
    buildPrint(song, printView(view));
  };
  window.addEventListener('hashchange', redraw);
  window.addEventListener('beforeprint', () => buildPrint(song, printView(currentView(song))));
  redraw();
}

main();
</script>
</body>
</html>
